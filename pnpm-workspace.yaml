# pnpm workspace config — holds pnpm settings for this single-package repo.
# Keep all pnpm settings here (not in package.json) so pnpm 11+ has one source.

# Supply-chain hardening: refuse package versions newer than 3 days (4320 min).
# Defuses fast-moving compromise patterns (e.g. chalk/debug 2024-2025 incidents).
minimumReleaseAge: 4320

# Packages exempt from the cooldown (transitive Astro deps).
minimumReleaseAgeExclude:
  - astro
  - '@astrojs/check'
  - '@astrojs/internal-helpers'
  - '@astrojs/markdown-remark'

# Native packages allowed to run install scripts (require explicit opt-in on pnpm 11+).
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Security patches for production transitive dependencies.
overrides:
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  esbuild: 0.28.1
  'brace-expansion@>=5.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'glob@>=9.0.0 <14.0.2': 14.0.2
  'minimatch@<11.0.1': 11.0.1
  'postcss@<8.5.23': 8.5.23
  'postcss-selector-parser@>=7.0.0 <7.1.6': 7.1.6
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'undici@>=7.0.0 <7.30.1': 7.30.1
  'yaml@>=2.0.0 <2.8.3': 2.8.3
